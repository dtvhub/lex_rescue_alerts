<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #000;
        font-family: Arial, sans-serif;
        color: white;
        height: 100vh;
        display: grid;
        grid-template-rows: 80px 1fr 1fr;
        gap: 6px;
    }

    .row {
        display: grid;
        gap: 6px;
    }

    /* Updated to 6 columns for Alaska */
    .time-row {
        grid-template-columns: repeat(6, 1fr);
        background: #000;
    }

    .time-box {
        background: #111;
        border: 2px solid #222;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        text-align: center;
    }

    .panel {
        background: #000;
        border: 2px solid #222;
        position: relative;
        overflow: hidden;
    }

    .panel video, .panel iframe {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }

    .label {
        position: absolute;
        top: 6px;
        left: 6px;
        background: rgba(0,0,0,0.6);
        padding: 4px 8px;
        font-size: 14px;
        border-radius: 4px;
    }

    .fullscreen-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,0.6);
        padding: 4px 8px;
        font-size: 14px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
// Load HLS streams
function loadStream(id, url) {
    const video = document.getElementById(id);

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
    }
}

// Fullscreen handler
function goFullscreen(elementId) {
    const el = document.getElementById(elementId);
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

// Clock updater (updated with Alaska)
function updateClocks() {
    const zones = [
        { id: "hst",  tz: "Pacific/Honolulu" },
        { id: "akst", tz: "America/Anchorage" },
        { id: "pst",  tz: "America/Los_Angeles" },
        { id: "mst",  tz: "America/Denver" },
        { id: "cst",  tz: "America/Chicago" },
        { id: "est",  tz: "America/New_York" }
    ];

    zones.forEach(z => {
        document.getElementById(z.id).innerText =
            new Date().toLocaleTimeString("en-US", { timeZone: z.tz });
    });
}

setInterval(updateClocks, 1000);
</script>
</head>

<body>

<!-- TIME ZONES (updated with Alaska) -->
<div class="row time-row">
    <div class="time-box"><strong>Hawaii</strong><div id="hst"></div></div>
    <div class="time-box"><strong>Alaska</strong><div id="akst"></div></div>
    <div class="time-box"><strong>Pacific</strong><div id="pst"></div></div>
    <div class="time-box"><strong>Mountain</strong><div id="mst"></div></div>
    <div class="time-box"><strong>Central</strong><div id="cst"></div></div>
    <div class="time-box"><strong>Eastern</strong><div id="est"></div></div>
</div>


</body>
</html>
